name: Mooncard
description: 'Mooncard is a French corporate expense-management platform that pairs a smart
  payment card, a mobile app, and accounting-automation software so finance teams can handle
  business spending end to end without manual data entry. It automates expense reports, VAT
  recovery, and mileage and per-diem calculations, then syncs transactions into accounting
  systems such as Sage, Cegid, SAP, Microsoft Dynamics, Exact Online, and Agicap. Mooncard
  also runs a developer program that offers API access plus a sandbox environment, though the
  API reference and OpenAPI are gated behind a developer-portal login and are not publicly
  discoverable.'
